<!DOCTYPE html>
<html>
<head>
    <title>TMS - Create LR</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<h2>Create Lorry Receipt</h2>

<form id="lrForm">
    <input type="text" name="lr_number" placeholder="LR Number" required>
    <input type="text" name="sender_name" placeholder="Sender Name" required>
    <input type="text" name="receiver_name" placeholder="Receiver Name" required>
    <input type="text" name="origin" placeholder="Origin" required>
    <input type="text" name="destination" placeholder="Destination" required>
    <input type="text" name="vehicle_number" placeholder="Vehicle Number">
    <input type="number" step="0.01" name="freight_amount" placeholder="Freight Amount" required>
    <input type="date" name="lr_date" required>
    <button type="submit">Save LR</button>
</form>

<script>
document.getElementById("lrForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const formData = new FormData(this);
    const data = Object.fromEntries(formData.entries());

    const response = await fetch("api/create_lr.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    if (result.status === "success") {
        alert("LR Created Successfully!");
        this.reset();
    } else {
        alert("Error: " + result.message);
    }
});
</script>

</body>
</html>
